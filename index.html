<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>YellowBerry — Маркетплейс выгодных покупок</title>
  <style>
    /* ==========================================================================
       БАЗОВЫЕ ПЕРЕМЕННЫЕ И ОПТИМИЗАЦИЯ ПРОИЗВОДИТЕЛЬНОСТИ (БЕЗ ТЯЖЕЛЫХ ТЕНЕЙ/BLUR)
       ========================================================================== */
    :root {
      --bg-page: #f4f4f6;
      --bg-card: #ffffff;
      --yellow-main: #ffdd00;
      --yellow-hover: #f5d000;
      --yellow-light: #fffbe0;
      --black: #141414;
      --text-main: #1a1a1a;
      --text-muted: #76767a;
      --border-color: #e2e2e6;
      --red-badge: #ff3b30;
      --green-badge: #16a34a;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --container-max: 1280px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.4;
      overflow-x: hidden;
    }

    button, input, select {
      font-family: inherit;
      font-size: inherit;
      outline: none;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 12px;
    }

    /* ==========================================================================
       ШАПКА (STICKY HEADER)
       ========================================================================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--yellow-main);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      padding: 10px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 20px;
      color: var(--black);
      text-decoration: none;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .logo-badge {
      background-color: var(--black);
      color: var(--yellow-main);
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 900;
    }

    .search-box {
      flex: 1 1 220px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 40px;
      padding: 0 38px 0 14px;
      border-radius: var(--radius-md);
      border: 2px solid var(--black);
      background-color: #ffffff;
      color: var(--text-main);
      font-size: 15px;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e5e5ea;
      color: var(--black);
      font-size: 14px;
      font-weight: bold;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .search-clear.visible {
      display: flex;
    }

    .cart-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      padding: 0 14px;
      background-color: var(--black);
      color: #ffffff;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }

    .cart-btn:active {
      transform: scale(0.98);
    }

    .cart-badge {
      background-color: var(--yellow-main);
      color: var(--black);
      font-size: 12px;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================================
       КАТЕГОРИИ И ФИЛЬТРЫ
       ========================================================================== */
    .controls-section {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 0 12px;
      margin-bottom: 14px;
    }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      padding: 7px 14px;
      border-radius: 20px;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .cat-pill.active {
      background-color: var(--black);
      color: var(--yellow-main);
      font-weight: 700;
    }

    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .price-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .price-input {
      width: 96px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background-color: var(--bg-page);
      font-size: 14px;
    }

    .price-input:focus {
      border-color: var(--black);
      background-color: #fff;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 10px;
      background-color: var(--bg-page);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--black);
    }

    .sort-select {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background-color: var(--bg-page);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      margin-left: auto;
    }

    .reset-filters-btn {
      height: 36px;
      padding: 0 10px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: underline;
    }

    /* ==========================================================================
       СЕТКА ТОВАРОВ И КАРТОЧКА
       ========================================================================== */
    .catalog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding-bottom: 40px;
    }

    @media (min-width: 640px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
    }

    @media (min-width: 960px) {
      .products-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
    }

    @media (min-width: 1200px) {
      .products-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .card {
      background-color: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #f9f9fb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .card-img-wrap svg,
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-discount {
      position: absolute;
      left: 8px;
      bottom: 8px;
      background-color: var(--yellow-main);
      color: var(--black);
      font-size: 12px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .price-current {
      font-size: 17px;
      font-weight: 800;
      color: var(--black);
    }

    .price-old {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .card-title {
      font-size: 13px;
      color: var(--text-main);
      margin-bottom: 6px;
      cursor: pointer;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 36px;
    }

    .card-brand {
      font-weight: 700;
      color: var(--black);
    }

    .card-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      margin-top: auto;
    }

    .star-icon {
      color: #f59e0b;
      font-weight: bold;
    }

    /* Кнопки добавления и счетчик в карточке */
    .btn-add {
      width: 100%;
      height: 36px;
      background-color: var(--yellow-main);
      color: var(--black);
      font-weight: 700;
      font-size: 14px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-add:active {
      background-color: var(--yellow-hover);
    }

    .stepper {
      width: 100%;
      height: 36px;
      background-color: var(--black);
      color: #ffffff;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      font-weight: 700;
      font-size: 15px;
    }

    .stepper button {
      width: 32px;
      height: 28px;
      color: var(--yellow-main);
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Пустой результат */
    .empty-state {
      grid-column: 1 / -1;
      background-color: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 40px 20px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .empty-state h3 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .btn-primary {
      background-color: var(--yellow-main);
      color: var(--black);
      font-weight: 700;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 14px;
    }

    /* ==========================================================================
       МОДАЛЬНЫЕ ОКНА (ТОВАР И КОРЗИНА)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }

    .modal-box {
      background-color: var(--bg-card);
      width: 100%;
      max-width: 720px;
      max-height: 92vh;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .modal-box {
        border-radius: var(--radius-lg);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      background-color: #fff;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--bg-page);
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    /* Детали товара */
    .product-detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .product-detail-grid {
        grid-template-columns: 260px 1fr;
      }
    }

    .detail-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .detail-img svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .detail-category {
      display: inline-block;
      font-size: 12px;
      background-color: var(--yellow-light);
      color: var(--black);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .detail-name {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .detail-price-block {
      background-color: var(--bg-page);
      padding: 12px;
      border-radius: var(--radius-md);
      margin: 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .specs-list {
      margin-top: 12px;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
      border-bottom: 1px dashed var(--border-color);
    }

    .spec-key {
      color: var(--text-muted);
    }

    .spec-val {
      font-weight: 600;
      text-align: right;
    }

    .review-card {
      background-color: var(--bg-page);
      padding: 10px;
      border-radius: var(--radius-sm);
      margin-top: 8px;
      font-size: 13px;
    }

    /* Корзина */
    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      align-items: center;
    }

    .cart-item-img {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      flex-shrink: 0;
      overflow: hidden;
    }

    .cart-item-img svg {
      width: 100%;
      height: 100%;
    }

    .cart-item-info {
      flex: 1;
      min-width: 0;
    }

    .cart-item-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .cart-item-price {
      font-size: 15px;
      font-weight: 800;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-stepper {
      display: flex;
      align-items: center;
      background-color: var(--bg-page);
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .mini-stepper button {
      width: 28px;
      height: 28px;
      font-weight: bold;
      font-size: 16px;
    }

    .mini-stepper span {
      min-width: 24px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .remove-item-btn {
      color: var(--text-muted);
      padding: 6px;
      font-size: 16px;
    }

    .promo-box {
      display: flex;
      gap: 8px;
      margin: 14px 0;
    }

    .promo-input {
      flex: 1;
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      text-transform: uppercase;
    }

    .promo-btn {
      height: 38px;
      padding: 0 14px;
      background-color: var(--black);
      color: var(--yellow-main);
      font-weight: 700;
      border-radius: var(--radius-sm);
      font-size: 13px;
    }

    .promo-msg {
      font-size: 12px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .cart-summary {
      background-color: var(--bg-page);
      padding: 12px;
      border-radius: var(--radius-md);
      margin-top: 10px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 900;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      margin-top: 6px;
    }

    .checkout-form {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
    }

    .btn-checkout {
      width: 100%;
      height: 44px;
      background-color: var(--yellow-main);
      color: var(--black);
      font-weight: 800;
      font-size: 16px;
      border-radius: var(--radius-sm);
      margin-top: 4px;
    }

    /* Всплывающее уведомление (Toast) */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: var(--black);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      z-index: 300;
      transition: transform 0.2s ease;
      white-space: nowrap;
      border: 1px solid var(--yellow-main);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Подвал */
    .footer {
      background-color: var(--black);
      color: #a1a1aa;
      padding: 24px 0;
      font-size: 13px;
      margin-top: auto;
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
    }
  </style>
</head>
<body>

  <!-- ШАПКА САЙТА -->
  <header class="header">
    <div class="container header-inner">
      <a href="#" class="logo" id="logoReset">
        <span class="logo-badge">YB</span>
        <span>YellowBerry</span>
      </a>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Найти на YellowBerry..."
          autocomplete="off"
        >
        <button type="button" id="searchClear" class="search-clear" aria-label="Очистить поиск">✕</button>
      </div>

      <button type="button" id="openCartBtn" class="cart-btn">
        <span>🛒 Корзина</span>
        <span id="cartBadge" class="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- КАТЕГОРИИ И ФИЛЬТРЫ -->
  <section class="controls-section">
    <div class="container">
      <div class="categories-scroll" id="categoryTabs">
        <!-- Категории рендерятся через JS -->
      </div>

      <div class="filters-bar">
        <div class="price-group">
          <input type="number" id="priceMin" class="price-input" placeholder="От, BYN" min="0" step="0.01">
          <span>—</span>
          <input type="number" id="priceMax" class="price-input" placeholder="До, BYN" min="0" step="0.01">
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="discountOnly">
          <span>Только со скидкой</span>
        </label>

        <button type="button" id="resetFiltersBtn" class="reset-filters-btn">Сбросить</button>

        <select id="sortSelect" class="sort-select" aria-label="Сортировка">
          <option value="popular">По популярности</option>
          <option value="price_asc">Сначала дешевле</option>
          <option value="price_desc">Сначала дороже</option>
          <option value="rating">По рейтингу</option>
        </select>
      </div>
    </div>
  </section>

  <!-- КАТАЛОГ ТОВАРОВ -->
  <main class="container">
    <div class="catalog-header">
      <span id="catalogTitle">Все товары</span>
      <span id="productsCount">Найдено: 0</span>
    </div>

    <div class="products-grid" id="productsGrid">
      <!-- Карточки товаров рендерятся через JS -->
    </div>
  </main>

  <!-- ПОДВАЛ -->
  <footer class="footer">
    <div class="container footer-inner">
      <div>© 2026 YellowBerry — Быстрый маркетплейс</div>
      <div>Промокод на скидку 10%: <strong style="color: var(--yellow-main);">YELLOW10</strong></div>
    </div>
  </footer>

  <!-- МОДАЛЬНОЕ ОКНО ТОВАРА -->
  <div class="modal-backdrop" id="productModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modalProductBrand">О товаре</span>
        <button type="button" class="modal-close" id="closeProductModal" aria-label="Закрыть">✕</button>
      </div>
      <div class="modal-body" id="productModalBody">
        <!-- Контент карточки товара -->
      </div>
    </div>
  </div>

      function formatPrice(num) {
        const rounded = Math.round((Number(num) + Number.EPSILON) * 100) / 100;
        const parts = rounded.toFixed(2).split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      }

      /* ========================================================================
         4. УПРАВЛЕНИЕ КОРЗИНОЙ
         ======================================================================== */
      function addToCart(productId, silent = false) {
        state.cart[productId] = (state.cart[productId] || 0) + 1;
        saveCart();
        updateCartBadge();
        renderProducts();
        if (!silent) showToast('Добавлено в корзину');
      }

      function changeCartQty(productId, delta) {
        const current = state.cart[productId] || 0;
        const next = current + delta;
        if (next <= 0) {
          delete state.cart[productId];
        } else {
          state.cart[productId] = next;
        }
        saveCart();
        updateCartBadge();
        renderProducts();
        if (document.getElementById('cartModal').classList.contains('open')) {
          renderCartModal();
        }
      }

      function updateCartBadge() {
        const totalCount = Object.values(state.cart).reduce((sum, qty) => sum + qty, 0);
        document.getElementById('cartBadge').textContent = totalCount;
      }

      /* ========================================================================
         5. РЕНДЕР КАТЕГОРИЙ И КАТАЛОГА ТОВАРОВ
         ======================================================================== */
      function renderCategories() {
        const container = document.getElementById('categoryTabs');
        container.innerHTML = CATEGORIES.map(cat => `
          <button
            type="button"
            class="cat-pill ${state.category === cat ? 'active' : ''}"
            data-category="${cat}"
          >${cat}</button>
        `).join('');
      }

      function getFilteredProducts() {
        const q = state.search.trim().toLowerCase();
        const minP = state.priceMin !== '' ? Number(state.priceMin) : null;
        const maxP = state.priceMax !== '' ? Number(state.priceMax) : null;

        let list = PRODUCTS.filter(p => {
          if (state.category !== 'Все' && p.category !== state.category) return false;
          if (state.discountOnly && getDiscountPercent(p.price, p.oldPrice) === 0) return false;
          if (minP !== null && !isNaN(minP) && p.price < minP) return false;
          if (maxP !== null && !isNaN(maxP) && p.price > maxP) return false;
          if (q) {
            const hay = `${p.brand} ${p.title} ${p.category}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        // Сортировка
        list.sort((a, b) => {
          if (state.sort === 'price_asc') return a.price - b.price;
          if (state.sort === 'price_desc') return b.price - a.price;
          if (state.sort === 'rating') return b.rating - a.rating || b.reviewsCount - a.reviewsCount;
          return b.popular - a.popular;
        });

        return list;
      }

      function renderProducts() {
        const grid = document.getElementById('productsGrid');
        const list = getFilteredProducts();

        document.getElementById('catalogTitle').textContent =
          state.category === 'Все' ? 'Все товары' : state.category;
        document.getElementById('productsCount').textContent = `Найдено: ${list.length}`;

        if (list.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <h3>Ничего не найдено</h3>
              <p>Попробуйте изменить запрос или сбросить установленные фильтры</p>
              <button type="button" class="btn-primary" id="emptyResetBtn">Сбросить фильтры</button>
            </div>
          `;
          return;
        }

        grid.innerHTML = list.map(p => {
          const discount = getDiscountPercent(p.price, p.oldPrice);
          const qtyInCart = state.cart[p.id] || 0;

          const actionHtml = qtyInCart > 0
            ? `<div class="stepper" data-id="${p.id}">
                 <button type="button" class="js-dec" data-id="${p.id}" aria-label="Уменьшить">−</button>
                 <span>${qtyInCart} шт.</span>
                 <button type="button" class="js-inc" data-id="${p.id}" aria-label="Увеличить">+</button>
               </div>`
            : `<button type="button" class="btn-add js-add" data-id="${p.id}">В корзину</button>`;

          return `
            <article class="card">
              <div class="card-img-wrap js-open-product" data-id="${p.id}">
                <img src="${p.image}" alt="${p.title}" loading="lazy">
                ${discount > 0 ? `<span class="badge-discount">-${discount}%</span>` : ''}
              </div>
              <div class="card-body">
                <div class="price-row">
                  <span class="price-current">${formatPrice(p.price)}</span>
                  ${discount > 0 ? `<span class="price-old">${formatPrice(p.oldPrice)}</span>` : ''}
                </div>
                <div class="card-title js-open-product" data-id="${p.id}">
                  <span class="card-brand">${p.brand}</span> / ${p.title}
                </div>
                <div class="card-rating">
                  <span class="star-icon">★</span>
                  <strong style="color: var(--text-main);">${p.rating.toFixed(1)}</strong>
                  <span>(${p.reviewsCount})</span>
                </div>
                ${actionHtml}
              </div>
            </article>
          `;
        }).join('');
      }

      /* ========================================================================
         6. МОДАЛЬНОЕ ОКНО КАРТОЧКИ ТОВАРА
         ======================================================================== */
      function openProductModal(productId) {
        const p = PRODUCTS.find(item => item.id === productId);
        if (!p) return;

        const discount = getDiscountPercent(p.price, p.oldPrice);
        document.getElementById('modalProductBrand').textContent = p.brand;

        const specsHtml = Object.entries(p.specs).map(([key, val]) => `
          <div class="spec-row">
            <span class="spec-key">${key}</span>
            <span class="spec-val">${val}</span>
          </div>
        `).join('');

        const reviewsHtml = p.reviews.map(r => `
          <div class="review-card">
            <div style="font-weight: 700; margin-bottom: 3px;">${r.author} <span class="star-icon">★★★★★</span></div>
            <div>${r.text}</div>
          </div>
        `).join('');

        document.getElementById('productModalBody').innerHTML = `
          <div class="product-detail-grid">
            <div class="detail-img">
              <img src="${p.image}" alt="${p.title}">
            </div>
            <div>
              <span class="detail-category">${p.category}</span>
              <h2 class="detail-name">${p.brand} — ${p.title}</h2>
              <div class="card-rating" style="margin-bottom: 8px;">
                <span class="star-icon">★</span>
                <strong style="color: var(--text-main);">${p.rating.toFixed(1)}</strong>
                <span>• ${p.reviewsCount} оценок</span>
              </div>

              <div class="detail-price-block">
                <div>
                  <div class="price-current" style="font-size: 22px;">${formatPrice(p.price)}</div>
                  ${discount > 0 ? `<div class="price-old">${formatPrice(p.oldPrice)} (выгода ${formatPrice(p.oldPrice - p.price)})</div>` : ''}
                </div>
                <button type="button" class="btn-primary js-modal-add" data-id="${p.id}" style="padding: 12px 20px; font-size: 15px;">
                  Добавить в корзину
                </button>
              </div>

              <p style="font-size: 14px; color: var(--text-main); margin-bottom: 10px;">${p.description}</p>

              <div class="specs-list">
                <div style="font-weight: 700; font-size: 14px; margin-bottom: 4px;">Характеристики</div>
                ${specsHtml}
              </div>

              <div style="margin-top: 14px;">
                <div style="font-weight: 700; font-size: 14px;">Отзывы покупателей</div>
                ${reviewsHtml}
              </div>
            </div>
          </div>
        `;

        document.getElementById('productModal').classList.add('open');
      }

      /* ========================================================================
         7. МОДАЛЬНОЕ ОКНО КОРЗИНЫ И ОФОРМЛЕНИЕ ЗАКАЗА
         ======================================================================== */
      function renderCartModal() {
        const body = document.getElementById('cartModalBody');
        const entries = Object.entries(state.cart);

        if (entries.length === 0) {
          body.innerHTML = `
            <div style="text-align: center; padding: 36px 16px;">
              <div style="font-size: 40px; margin-bottom: 10px;">🛒</div>
              <h3 style="margin-bottom: 6px;">В корзине пока пусто</h3>
              <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;">
                Загляните в каталог, там много товаров со скидками
              </p>
              <button type="button" class="btn-primary" id="cartGoShopBtn">Перейти к покупкам</button>
            </div>
          `;
          return;
        }

        let subtotal = 0;
        let oldSubtotal = 0;
        let totalQty = 0;

        const itemsHtml = entries.map(([idStr, qty]) => {
          const p = PRODUCTS.find(item => item.id === Number(idStr));
          if (!p) return '';
          subtotal += p.price * qty;
          oldSubtotal += (p.oldPrice || p.price) * qty;
          totalQty += qty;

          return `
            <div class="cart-item">
              <div class="cart-item-img">
                <img src="${p.image}" alt="${p.title}">
              </div>
              <div class="cart-item-info">
                <div class="cart-item-title">${p.brand} — ${p.title}</div>
                <div class="cart-item-price">${formatPrice(p.price * qty)}</div>
              </div>
              <div class="cart-item-controls">
                <div class="mini-stepper">
                  <button type="button" class="js-cart-dec" data-id="${p.id}">−</button>
                  <span>${qty}</span>
                  <button type="button" class="js-cart-inc" data-id="${p.id}">+</button>
                </div>
                <button type="button" class="remove-item-btn js-cart-remove" data-id="${p.id}" title="Удалить">🗑</button>
              </div>
            </div>
          `;
        }).join('');

        const catalogDiscount = +(oldSubtotal - subtotal).toFixed(2);
        const promoSum = +(subtotal * state.promoDiscount).toFixed(2);
        const finalSum = +(subtotal - promoSum).toFixed(2);

        body.innerHTML = `
          <div>${itemsHtml}</div>

          <div class="promo-box">
            <input
              type="text"
              id="promoInput"
              class="promo-input"
              placeholder="Промокод (например, YELLOW10)"
              value="${state.promoCode}"
            >
            <button type="button" id="applyPromoBtn" class="promo-btn">Применить</button>
          </div>
          ${state.promoDiscount > 0
            ? `<div class="promo-msg" style="color: var(--green-badge);">✓ Промокод ${state.promoCode} применен (-${Math.round(state.promoDiscount * 100)}%)</div>`
            : `<div class="promo-msg" style="color: var(--text-muted);">Подсказка: введите YELLOW10 для скидки 10%</div>`
          }

          <div class="cart-summary">
            <div class="summary-row">
              <span>Товары (${totalQty} шт.)</span>
              <span>${formatPrice(oldSubtotal)}</span>
            </div>
            ${catalogDiscount > 0 ? `
              <div class="summary-row" style="color: var(--green-badge);">
                <span>Скидка маркетплейса</span>
                <span>−${formatPrice(catalogDiscount)}</span>
              </div>
            ` : ''}
            ${promoSum > 0 ? `
              <div class="summary-row" style="color: var(--green-badge);">
                <span>Скидка по промокоду</span>
                <span>−${formatPrice(promoSum)}</span>
              </div>
            ` : ''}
            <div class="summary-row">
              <span>Доставка в пункт выдачи</span>
              <span style="color: var(--green-badge); font-weight: 600;">Бесплатно</span>
            </div>
            <div class="summary-total">
              <span>Итого к оплате</span>
              <span>${formatPrice(finalSum)}</span>
            </div>
          </div>

          <form class="checkout-form" id="checkoutForm">
            <input type="text" id="orderName" class="form-input" placeholder="Ваше имя" required>
            <input type="tel" id="orderPhone" class="form-input" placeholder="Телефон для получения заказа" required>
            <input type="text" id="orderAddress" class="form-input" placeholder="Адрес пункта выдачи или доставки" required>
            <button type="submit" class="btn-checkout">Оформить заказ • ${formatPrice(finalSum)}</button>
          </form>
        `;
      }

      /* ========================================================================
         8. ОБРАБОТЧИКИ СОБЫТИЙ
         ======================================================================== */
      function resetAllFilters() {
        state.category = 'Все';
        state.search = '';
        state.priceMin = '';
        state.priceMax = '';
        state.discountOnly = false;
        state.sort = 'popular';

        document.getElementById('searchInput').value = '';
        document.getElementById('searchClear').classList.remove('visible');
        document.getElementById('priceMin').value = '';
        document.getElementById('priceMax').value = '';
        document.getElementById('discountOnly').checked = false;
        document.getElementById('sortSelect').value = 'popular';

        renderCategories();
        renderProducts();
      }

      function initEvents() {
        // Логотип — сброс фильтров
        document.getElementById('logoReset').addEventListener('click', (e) => {
          e.preventDefault();
          resetAllFilters();
        });

        // Живой поиск
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');

        searchInput.addEventListener('input', (e) => {
          state.search = e.target.value;
          searchClear.classList.toggle('visible', state.search.length > 0);
          renderProducts();
        });

        searchClear.addEventListener('click', () => {
          searchInput.value = '';
          state.search = '';
          searchClear.classList.remove('visible');
          renderProducts();
          searchInput.focus();
        });

        // Выбор категории (делегирование)
        document.getElementById('categoryTabs').addEventListener('click', (e) => {
          const btn = e.target.closest('.cat-pill');
          if (!btn) return;
          state.category = btn.dataset.category;
          renderCategories();
          renderProducts();
        });

        // Фильтры цен, скидки, сортировки
        document.getElementById('priceMin').addEventListener('input', (e) => {
          state.priceMin = e.target.value;
          renderProducts();
        });

        document.getElementById('priceMax').addEventListener('input', (e) => {
          state.priceMax = e.target.value;
          renderProducts();
        });

        document.getElementById('discountOnly').addEventListener('change', (e) => {
          state.discountOnly = e.target.checked;
          renderProducts();
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
          state.sort = e.target.value;
          renderProducts();
        });

        document.getElementById('resetFiltersBtn').addEventListener('click', resetAllFilters);

        // Клики по сетке товаров (делегирование)
        document.getElementById('productsGrid').addEventListener('click', (e) => {
          if (e.target.id === 'emptyResetBtn') {
            resetAllFilters();
            return;
          }

          const addBtn = e.target.closest('.js-add');
          if (addBtn) {
            addToCart(Number(addBtn.dataset.id));
            return;
          }

          const incBtn = e.target.closest('.js-inc');
          if (incBtn) {
            changeCartQty(Number(incBtn.dataset.id), 1);
            return;
          }

          const decBtn = e.target.closest('.js-dec');
          if (decBtn) {
            changeCartQty(Number(decBtn.dataset.id), -1);
            return;
          }

          const openCard = e.target.closest('.js-open-product');
          if (openCard) {
            openProductModal(Number(openCard.dataset.id));
          }
        });

        // Модальное окно товара
        const productModal = document.getElementById('productModal');
        document.getElementById('closeProductModal').addEventListener('click', () => {
          productModal.classList.remove('open');
        });
        productModal.addEventListener('click', (e) => {
          if (e.target === productModal) productModal.classList.remove('open');
          const modalAdd = e.target.closest('.js-modal-add');
          if (modalAdd) {
            addToCart(Number(modalAdd.dataset.id));
          }
        });

        // Модальное окно корзины
        const cartModal = document.getElementById('cartModal');
        document.getElementById('openCartBtn').addEventListener('click', () => {
          renderCartModal();
          cartModal.classList.add('open');
        });

        document.getElementById('closeCartModal').addEventListener('click', () => {
          cartModal.classList.remove('open');
        });

        cartModal.addEventListener('click', (e) => {
          if (e.target === cartModal || e.target.id === 'cartGoShopBtn') {
            cartModal.classList.remove('open');
            return;
          }

          const inc = e.target.closest('.js-cart-inc');
          if (inc) {
            changeCartQty(Number(inc.dataset.id), 1);
            return;
          }

          const dec = e.target.closest('.js-cart-dec');
          if (dec) {
            changeCartQty(Number(dec.dataset.id), -1);
            return;
          }

          const rem = e.target.closest('.js-cart-remove');
          if (rem) {
            delete state.cart[Number(rem.dataset.id)];
            saveCart();
            updateCartBadge();
            renderProducts();
            renderCartModal();
            return;
          }

          if (e.target.id === 'applyPromoBtn') {
            const code = document.getElementById('promoInput').value.trim().toUpperCase();
            if (PROMO_CODES[code]) {
              state.promoCode = code;
              state.promoDiscount = PROMO_CODES[code];
              showToast(`Промокод ${code} активирован!`);
            } else {
              state.promoCode = '';
              state.promoDiscount = 0;
              showToast('Неверный промокод');
            }
            renderCartModal();
          }
        });

        // Отправка заказа
        cartModal.addEventListener('submit', (e) => {
          if (e.target.id === 'checkoutForm') {
            e.preventDefault();
            const name = document.getElementById('orderName').value.trim();
            const orderNum = Math.floor(100000 + Math.random() * 900000);

            state.cart = {};
            state.promoCode = '';
            state.promoDiscount = 0;
            saveCart();
            updateCartBadge();
            renderProducts();

            document.getElementById('cartModalBody').innerHTML = `
              <div style="text-align: center; padding: 32px 16px;">
                <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--yellow-main); color: var(--black); font-size: 28px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">✓</div>
                <h3 style="margin-bottom: 8px;">Заказ №${orderNum} оформлен!</h3>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 18px;">
                  Спасибо, ${name}! Мы уже собираем ваши товары и отправим уведомление о готовности к выдаче.
                </p>
                <button type="button" class="btn-primary" id="cartGoShopBtn">Продолжить покупки</button>
              </div>
            `;
          }
        });

        // Закрытие модалок по Escape
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            productModal.classList.remove('open');
            cartModal.classList.remove('open');
          }
        });
      }

      // Запуск приложения
      renderCategories();
      renderProducts();
      updateCartBadge();
      initEvents();
    })();
  </script>
</body>
</html>
