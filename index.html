<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YellowBerry — Маркетплейс</title>
  <style>
    /* Минималистичные переменные и сброс стилей */
    :root {
      --bg: #f5f5f5;
      --white: #ffffff;
      --yellow: #ffdd00;
      --black: #141414;
      --gray: #757575;
      --border: #e0e0e0;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--black);
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button, input, select {
      font: inherit;
      color: inherit;
      outline: none;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 12px;
    }

    /* Шапка */
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--yellow);
      padding: 10px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .logo {
      font-weight: 900;
      font-size: 19px;
      text-decoration: none;
      color: var(--black);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo span {
      background: var(--black);
      color: var(--yellow);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 14px;
    }

    .search-box {
      flex: 1 1 180px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 32px 0 12px;
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: var(--radius);
      font-size: 14px;
    }

    .search-clear {
      position: absolute;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #eeeeee;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .search-clear.visible {
      display: flex;
    }

    .cart-btn {
      height: 38px;
      padding: 0 12px;
      background: var(--black);
      color: var(--white);
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cart-badge {
      background: var(--yellow);
      color: var(--black);
      font-size: 12px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* Категории и фильтры */
    .controls {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
      margin-bottom: 12px;
    }

    .categories {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      padding: 6px 12px;
      background: var(--bg);
      border-radius: 16px;
      font-size: 13px;
      white-space: nowrap;
    }

    .cat-btn.active {
      background: var(--black);
      color: var(--yellow);
      font-weight: 700;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .price-input {
      width: 88px;
      height: 34px;
      padding: 0 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
    }

    .reset-btn {
      font-size: 13px;
      color: var(--gray);
      text-decoration: underline;
      padding: 0 4px;
    }

    .sort-select {
      height: 34px;
      padding: 0 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      margin-left: auto;
    }

    /* Каталог */
    .catalog-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding-bottom: 24px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
    }

    @media (min-width: 960px) {
      .grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #fafafa;
      cursor: pointer;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .card-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .prices {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .price-now {
      font-size: 16px;
      font-weight: 800;
    }

    .price-old {
      font-size: 12px;
      color: var(--gray);
      text-decoration: line-through;
    }

    .card-title {
      font-size: 13px;
      margin-bottom: 10px;
      cursor: pointer;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .btn-yellow {
      width: 100%;
      height: 34px;
      background: var(--yellow);
      color: var(--black);
      font-weight: 700;
      font-size: 13px;
      border-radius: 6px;
    }

    .stepper {
      width: 100%;
      height: 34px;
      background: var(--black);
      color: var(--white);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }

    .stepper button {
      width: 32px;
      height: 100%;
      color: var(--yellow);
      font-size: 16px;
      font-weight: 800;
    }

    .empty {
      grid-column: 1 / -1;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
    }

    /* Модальное окно товара */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 20;
      display: none;
    }

    .backdrop.open {
      display: flex;
    }

    .modal-center {
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-card {
      background: var(--white);
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Боковая панель корзины */
    .drawer-side {
      justify-content: flex-end;
    }

    .drawer-panel {
      background: var(--white);
      width: 100%;
      max-width: 400px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      font-size: 16px;
    }

    .close-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg);
      font-size: 14px;
    }

    .panel-body {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
    }

    /* Детали товара */
    .detail-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 520px) {
      .detail-layout {
        grid-template-columns: 200px 1fr;
      }
    }

    .detail-photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .detail-photo img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .specs {
      margin: 10px 0;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      font-size: 13px;
    }

    .spec-line {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    /* Корзина */
    .cart-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-thumb {
      width: 52px;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .cart-meta {
      flex: 1;
      min-width: 0;
      font-size: 13px;
    }

    .cart-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .mini-qty {
      display: flex;
      align-items: center;
      background: var(--bg);
      border-radius: 4px;
    }

    .mini-qty button {
      width: 24px;
      height: 24px;
      font-weight: 700;
    }

    .mini-qty span {
      min-width: 20px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 900;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .order-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-field {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }

    .footer {
      margin-top: auto;
      background: var(--black);
      color: #bdbdbd;
      padding: 16px 0;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="container header-inner">
      <a href="#" class="logo" id="logoBtn"><span>YB</span> YellowBerry</a>

      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск товаров..." autocomplete="off">
        <button type="button" id="searchClear" class="search-clear" aria-label="Очистить">✕</button>
      </div>

      <button type="button" id="openCartBtn" class="cart-btn">
        Корзина <span id="cartBadge" class="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- Категории и фильтры -->
  <section class="controls">
    <div class="container">
      <div class="categories" id="categoryList"></div>

      <div class="filters">
        <input type="number" id="priceMin" class="price-input" placeholder="От, BYN" min="0" step="0.01">
        <span>—</span>
        <input type="number" id="priceMax" class="price-input" placeholder="До, BYN" min="0" step="0.01">
        <button type="button" id="resetBtn" class="reset-btn">Сбросить</button>

        <select id="sortSelect" class="sort-select" aria-label="Сортировка">
          <option value="default">По умолчанию</option>
          <option value="price_asc">Сначала дешевые</option>
          <option value="price_desc">Сначала дорогие</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Каталог -->
  <main class="container">
    <div class="catalog-info">
      <span id="catTitle">Все товары</span>
      <span id="itemsCount">0 товаров</span>
    </div>
    <div class="grid" id="productGrid"></div>
  </main>

  <footer class="footer">
    <div class="container">© 2026 YellowBerry — Простой маркетплейс (BYN)</div>
  </footer>

  <!-- Модальное окно товара -->
  <div class="backdrop modal-center" id="productModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="panel-head">
        <span id="modalBrand">Товар</span>
        <button type="button" class="close-btn" id="closeProductBtn" aria-label="Закрыть">✕</button>
      </div>
      <div class="panel-body" id="productModalBody"></div>
    </div>
  </div>

  <!-- Боковая панель корзины -->
  <div class="backdrop drawer-side" id="cartDrawer" role="dialog" aria-modal="true">
    <div class="drawer-panel">
      <div class="panel-head">
        <span>Корзина</span>
        <button type="button" class="close-btn" id="closeCartBtn" aria-label="Закрыть">✕</button>
      </div>
      <div class="panel-body" id="cartBody"></div>
    </div>
  </div>

        {

          brand: 'GranitCook',
          title: 'Сковорода антипригарная 26 см',
          category: 'Дом и кухня',
          price: 49.90,
          oldPrice: 69.00,
          image: makeSVG('#f2f2f2', 'pan', 'PAN 26CM'),
          description: 'Алюминиевая сковорода с антипригарным покрытием для всех типов плит.',
          specs: { 'Диаметр': '26 см', 'Индукция': 'Подходит', 'Ручка': 'Бакелит' }
        },
        {
          id: 12,
          brand: 'HydroSkin',
          title: 'Крем-гель увлажняющий с пантенолом',
          category: 'Красота',
          price: 18.50,
          oldPrice: null,
          image: makeSVG('#ecfeff', 'cream', 'PANTHENOL'),
          description: 'Успокаивающий крем-гель для ежедневного увлажнения кожи лица и тела.',
          specs: { 'Объем': '150 мл', 'Актив': 'Пантенол 5%', 'Текстура': 'Легкий гель' }
        },
        {
          id: 13,
          brand: 'YogaFlow',
          title: 'Коврик для фитнеса и йоги 6 мм',
          category: 'Спорт',
          price: 42.00,
          oldPrice: 58.00,
          image: makeSVG('#fef9c3', 'mat', 'YOGA MAT'),
          description: 'Нескользящий коврик из материала TPE со стяжкой для переноски.',
          specs: { 'Размер': '183 x 61 см', 'Толщина': '6 мм', 'Материал': 'TPE' }
        },
        {
          id: 14,
          brand: 'DenimCraft',
          title: 'Джинсы прямого кроя классические',
          category: 'Одежда',
          price: 94.00,
          oldPrice: 129.00,
          image: makeSVG('#eff6ff', 'jeans', 'DENIM'),
          description: 'Прямые джинсы средней посадки из плотного хлопкового денима.',
          specs: { 'Состав': '98% хлопок, 2% эластан', 'Крой': 'Прямой', 'Посадка': 'Средняя' }
        }
      ];

      const CATEGORIES = ['Все', 'Электроника', 'Одежда', 'Обувь', 'Дом и кухня', 'Красота', 'Спорт'];
      const STORAGE_KEY = 'yb_simple_cart_byn';

      let state = {
        category: 'Все',
        search: '',
        priceMin: '',
        priceMax: '',
        sort: 'default',
        cart: loadCart()
      };

      function loadCart() {
        try {
          const data = localStorage.getItem(STORAGE_KEY);
          return data ? JSON.parse(data) : {};
        } catch (e) {
          return {};
        }
      }

      function saveCart() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.cart));
        } catch (e) {}
      }

      function formatBYN(val) {
        return Number(val).toFixed(2).replace('.', ',') + ' BYN';
      }

      function updateBadge() {
        const count = Object.values(state.cart).reduce((sum, n) => sum + n, 0);
        document.getElementById('cartBadge').textContent = count;
      }

      function changeQty(id, delta) {
        const next = (state.cart[id] || 0) + delta;
        if (next <= 0) {
          delete state.cart[id];
        } else {
          state.cart[id] = next;
        }
        saveCart();
        updateBadge();
        renderProducts();
        if (document.getElementById('cartDrawer').classList.contains('open')) {
          renderCart();
        }
      }

      // Рендер категорий
      function renderCategories() {
        document.getElementById('categoryList').innerHTML = CATEGORIES.map(cat => `
          <button type="button" class="cat-btn ${state.category === cat ? 'active' : ''}" data-cat="${cat}">
            ${cat}
          </button>
        `).join('');
      }

      // Фильтрация и рендер сетки товаров
      function renderProducts() {
        const q = state.search.trim().toLowerCase();
        const min = state.priceMin !== '' ? Number(state.priceMin) : null;
        const max = state.priceMax !== '' ? Number(state.priceMax) : null;

        let items = PRODUCTS.filter(p => {
          if (state.category !== 'Все' && p.category !== state.category) return false;
          if (min !== null && !isNaN(min) && p.price < min) return false;
          if (max !== null && !isNaN(max) && p.price > max) return false;
          if (q && !`${p.brand} ${p.title} ${p.category}`.toLowerCase().includes(q)) return false;
          return true;
        });

        if (state.sort === 'price_asc') items = [...items].sort((a, b) => a.price - b.price);
        if (state.sort === 'price_desc') items = [...items].sort((a, b) => b.price - a.price);

        document.getElementById('catTitle').textContent = state.category === 'Все' ? 'Все товары' : state.category;
        document.getElementById('itemsCount').textContent = `Найдено: ${items.length}`;

        const grid = document.getElementById('productGrid');
        if (items.length === 0) {
          grid.innerHTML = `
            <div class="empty">
              <p style="margin-bottom: 10px;">Товары не найдены</p>
              <button type="button" class="btn-yellow" id="emptyReset" style="width: auto; padding: 0 16px;">Сбросить фильтры</button>
            </div>
          `;
          return;
        }

        grid.innerHTML = items.map(p => {
          const qty = state.cart[p.id] || 0;
          const btnHtml = qty > 0
            ? `<div class="stepper">
                 <button type="button" class="js-dec" data-id="${p.id}">−</button>
                 <span>${qty} шт.</span>
                 <button type="button" class="js-inc" data-id="${p.id}">+</button>
               </div>`
            : `<button type="button" class="btn-yellow js-add" data-id="${p.id}">В корзину</button>`;

          return `
            <article class="card">
              <div class="card-img js-open" data-id="${p.id}">
                <img src="${p.image}" alt="${p.title}" loading="lazy">
              </div>
              <div class="card-body">
                <div class="prices">
                  <span class="price-now">${formatBYN(p.price)}</span>
                  ${p.oldPrice ? `<span class="price-old">${formatBYN(p.oldPrice)}</span>` : ''}
                </div>
                <div class="card-title js-open" data-id="${p.id}">
                  <strong>${p.brand}</strong> / ${p.title}
                </div>
                ${btnHtml}
              </div>
            </article>
          `;
        }).join('');
      }

      // Карточка товара (модальное окно)
      function openProduct(id) {
        const p = PRODUCTS.find(x => x.id === id);
        if (!p) return;

        document.getElementById('modalBrand').textContent = p.brand;
        const specsHtml = Object.entries(p.specs).map(([k, v]) => `
          <div class="spec-line">
            <span style="color: var(--gray);">${k}</span>
            <strong>${v}</strong>
          </div>
        `).join('');

        document.getElementById('productModalBody').innerHTML = `
          <div class="detail-layout">
            <div class="detail-photo"><img src="${p.image}" alt="${p.title}"></div>
            <div>
              <div style="font-size: 12px; color: var(--gray); margin-bottom: 4px;">${p.category}</div>
              <h3 style="font-size: 17px; margin-bottom: 8px;">${p.brand} — ${p.title}</h3>
              <div class="prices" style="margin-bottom: 10px;">
                <span class="price-now" style="font-size: 20px;">${formatBYN(p.price)}</span>
                ${p.oldPrice ? `<span class="price-old">${formatBYN(p.oldPrice)}</span>` : ''}
              </div>
              <p style="font-size: 13px; margin-bottom: 10px;">${p.description}</p>
              <div class="specs">${specsHtml}</div>
              <button type="button" class="btn-yellow js-modal-add" data-id="${p.id}" style="height: 40px; font-size: 14px;">
                Добавить в корзину
              </button>
            </div>
          </div>
        `;
        document.getElementById('productModal').classList.add('open');
      }

      // Боковая панель корзины
      function renderCart() {
        const body = document.getElementById('cartBody');
        const entries = Object.entries(state.cart);

        if (entries.length === 0) {
          body.innerHTML = `
            <div style="text-align: center; padding: 40px 10px;">
              <p style="color: var(--gray); margin-bottom: 12px;">Корзина пуста</p>
              <button type="button" class="btn-yellow" id="goCatalogBtn" style="width: auto; padding: 0 18px;">В каталог</button>
            </div>
          `;
          return;
        }

        let total = 0;
        const listHtml = entries.map(([idStr, qty]) => {
          const p = PRODUCTS.find(x => x.id === Number(idStr));
          if (!p) return '';
          total += p.price * qty;

          return `
            <div class="cart-row">
              <img src="${p.image}" alt="" class="cart-thumb">
              <div class="cart-meta">
                <div class="cart-name"><strong>${p.brand}</strong> ${p.title}</div>
                <div style="font-weight: 800;">${formatBYN(p.price * qty)}</div>
              </div>
              <div class="mini-qty">
                <button type="button" class="js-c-dec" data-id="${p.id}">−</button>
                <span>${qty}</span>
                <button type="button" class="js-c-inc" data-id="${p.id}">+</button>
              </div>
              <button type="button" class="js-c-del" data-id="${p.id}" aria-label="Удалить" style="color: var(--gray); padding: 4px;">✕</button>
            </div>
          `;
        }).join('');

        body.innerHTML = `
          <div>${listHtml}</div>
          <div class="total-box">
            <span>Итого:</span>
            <span>${formatBYN(total)}</span>
          </div>
          <form class="order-form" id="orderForm">
            <input type="text" id="custName" class="input-field" placeholder="Имя" required>
            <input type="tel" id="custPhone" class="input-field" placeholder="Телефон (+375...)" required>
            <input type="text" id="custAddress" class="input-field" placeholder="Адрес пункта выдачи" required>
            <button type="submit" class="btn-yellow" style="height: 42px; font-size: 14px;">
              Оформить заказ • ${formatBYN(total)}
            </button>
          </form>
        `;
      }

      function resetAll() {
        state.category = 'Все';
        state.search = '';
        state.priceMin = '';
        state.priceMax = '';
        state.sort = 'default';

        document.getElementById('searchInput').value = '';
        document.getElementById('searchClear').classList.remove('visible');
        document.getElementById('priceMin').value = '';
        document.getElementById('priceMax').value = '';
        document.getElementById('sortSelect').value = 'default';

        renderCategories();
        renderProducts();
      }

      // События
      document.getElementById('logoBtn').addEventListener('click', e => {
        e.preventDefault();
        resetAll();
      });

      const searchInput = document.getElementById('searchInput');
      const searchClear = document.getElementById('searchClear');

      searchInput.addEventListener('input', e => {
        state.search = e.target.value;
        searchClear.classList.toggle('visible', state.search.length > 0);
        renderProducts();
      });

      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        state.search = '';
        searchClear.classList.remove('visible');
        renderProducts();
      });

      document.getElementById('categoryList').addEventListener('click', e => {
        const btn = e.target.closest('.cat-btn');
        if (!btn) return;
        state.category = btn.dataset.cat;
        renderCategories();
        renderProducts();
      });

      document.getElementById('priceMin').addEventListener('input', e => {
        state.priceMin = e.target.value;
        renderProducts();
      });

      document.getElementById('priceMax').addEventListener('input', e => {
        state.priceMax = e.target.value;
        renderProducts();
      });

      document.getElementById('sortSelect').addEventListener('change', e => {
        state.sort = e.target.value;
        renderProducts();
      });

      document.getElementById('resetBtn').addEventListener('click', resetAll);

      document.getElementById('productGrid').addEventListener('click', e => {
        if (e.target.id === 'emptyReset') return resetAll();
        const add = e.target.closest('.js-add');
        if (add) return changeQty(Number(add.dataset.id), 1);
        const inc = e.target.closest('.js-inc');
        if (inc) return changeQty(Number(inc.dataset.id), 1);
        const dec = e.target.closest('.js-dec');
        if (dec) return changeQty(Number(dec.dataset.id), -1);
        const open = e.target.closest('.js-open');
        if (open) openProduct(Number(open.dataset.id));
      });

      const productModal = document.getElementById('productModal');
      document.getElementById('closeProductBtn').addEventListener('click', () => productModal.classList.remove('open'));
      productModal.addEventListener('click', e => {
        if (e.target === productModal) productModal.classList.remove('open');
        const add = e.target.closest('.js-modal-add');
        if (add) {
          changeQty(Number(add.dataset.id), 1);
          productModal.classList.remove('open');
        }
      });

      const cartDrawer = document.getElementById('cartDrawer');
      document.getElementById('openCartBtn').addEventListener('click', () => {
        renderCart();
        cartDrawer.classList.add('open');
      });
      document.getElementById('closeCartBtn').addEventListener('click', () => cartDrawer.classList.remove('open'));
      cartDrawer.addEventListener('click', e => {
        if (e.target === cartDrawer || e.target.id === 'goCatalogBtn') {
          cartDrawer.classList.remove('open');
          return;
        }
        const inc = e.target.closest('.js-c-inc');
        if (inc) return changeQty(Number(inc.dataset.id), 1);
        const dec = e.target.closest('.js-c-dec');
        if (dec) return changeQty(Number(dec.dataset.id), -1);
        const del = e.target.closest('.js-c-del');
        if (del) {
          delete state.cart[Number(del.dataset.id)];
          saveCart();
          updateBadge();
          renderProducts();
          renderCart();
        }
      });

      cartDrawer.addEventListener('submit', e => {
        if (e.target.id === 'orderForm') {
          e.preventDefault();
          const name = document.getElementById('custName').value.trim();
          const num = Math.floor(10000 + Math.random() * 90000);
          state.cart = {};
          saveCart();
          updateBadge();
          renderProducts();
          document.getElementById('cartBody').innerHTML = `
            <div style="text-align: center; padding: 36px 12px;">
              <h3 style="margin-bottom: 8px;">Заказ №${num} принят!</h3>
              <p style="font-size: 13px; color: var(--gray); margin-bottom: 16px;">
                Спасибо, ${name}! Мы сообщим, когда заказ прибудет в пункт выдачи.
              </p>
              <button type="button" class="btn-yellow" id="goCatalogBtn" style="width: auto; padding: 0 18px;">Закрыть</button>
            </div>
          `;
        }
      });

      // Инициализация
      renderCategories();
      renderProducts();
      updateBadge();
    })();
  </script>
</body>
</html>
