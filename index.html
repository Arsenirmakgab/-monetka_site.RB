<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YellowBerry — Маркетплейс</title>
  <style>
    /* Минималистичные переменные и сброс стилей */
    :root {
      --bg: #f5f5f5;
      --white: #ffffff;
      --yellow: #FFCC00;
      --black: #1A1A1A;
      --gray: #6e6e6e;
      --border: #e0e0e0;
      --danger: #d32f2f;
      --success: #2e7d32;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--black);
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    button, input, select {
      font: inherit;
      color: inherit;
      outline: none;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 12px;
    }

    /* Шапка */
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--yellow);
      padding: 10px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .logo {
      font-weight: 900;
      font-size: 19px;
      text-decoration: none;
      color: var(--black);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo span {
      background: var(--black);
      color: var(--yellow);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 14px;
    }

    .search-box {
      flex: 1 1 180px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 32px 0 12px;
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: var(--radius);
      font-size: 14px;
    }

    .search-clear {
      position: absolute;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #eeeeee;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .search-clear.visible {
      display: flex;
    }

    .cart-btn {
      height: 38px;
      padding: 0 12px;
      background: var(--black);
      color: var(--white);
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cart-badge {
      background: var(--yellow);
      color: var(--black);
      font-size: 12px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* Категории и фильтры */
    .controls {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
      margin-bottom: 12px;
    }

    .categories {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      padding: 6px 12px;
      background: var(--bg);
      border-radius: 16px;
      font-size: 13px;
      white-space: nowrap;
    }

    .cat-btn.active {
      background: var(--black);
      color: var(--yellow);
      font-weight: 700;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .price-input {
      width: 88px;
      height: 34px;
      padding: 0 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
    }

    .reset-btn {
      font-size: 13px;
      color: var(--gray);
      text-decoration: underline;
      padding: 0 4px;
    }

    .sort-select {
      height: 34px;
      padding: 0 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      margin-left: auto;
    }

    /* Каталог */
    .catalog-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding-bottom: 24px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
    }

    @media (min-width: 960px) {
      .grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #fafafa;
      cursor: pointer;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .card-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .prices {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .price-now {
      font-size: 16px;
      font-weight: 800;
    }

    .price-old {
      font-size: 12px;
      color: var(--gray);
      text-decoration: line-through;
    }

    .card-title {
      font-size: 13px;
      margin-bottom: 10px;
      cursor: pointer;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .btn-yellow {
      width: 100%;
      height: 34px;
      background: var(--yellow);
      color: var(--black);
      font-weight: 700;
      font-size: 13px;
      border-radius: 6px;
    }

    .stepper {
      width: 100%;
      height: 34px;
      background: var(--black);
      color: var(--white);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }

    .stepper button {
      width: 32px;
      height: 100%;
      color: var(--yellow);
      font-size: 16px;
      font-weight: 800;
    }

    .empty {
      grid-column: 1 / -1;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
    }

    /* Модальное окно товара */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 20;
      display: none;
    }

    .backdrop.open {
      display: flex;
    }

    .modal-center {
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-card {
      background: var(--white);
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Боковая панель корзины */
    .drawer-side {
      justify-content: flex-end;
    }

    .drawer-panel {
      background: var(--white);
      width: 100%;
      max-width: 400px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      font-size: 16px;
    }

    .close-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg);
      font-size: 14px;
    }

    .panel-body {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
    }

    /* Детали товара */
    .detail-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 520px) {
      .detail-layout {
        grid-template-columns: 200px 1fr;
      }
    }

    .detail-photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .detail-photo img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .specs {
      margin: 10px 0;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      font-size: 13px;
    }

    .spec-line {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    /* Корзина */
    .cart-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-thumb {
      width: 52px;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .cart-meta {
      flex: 1;
      min-width: 0;
      font-size: 13px;
    }

    .cart-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .mini-qty {
      display: flex;
      align-items: center;
      background: var(--bg);
      border-radius: 4px;
    }

    .mini-qty button {
      width: 24px;
      height: 24px;
      font-weight: 700;
    }

    .mini-qty span {
      min-width: 20px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 900;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .order-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-field, .textarea-field, .select-field {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: var(--white);
    }

    .input-field, .select-field {
      height: 38px;
    }

    .textarea-field {
      min-height: 68px;
      resize: vertical;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    /* Админ-панель */
    .admin-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      overflow-x: auto;
    }

    .admin-tab {
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--bg);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .admin-tab.active {
      background: var(--black);
      color: var(--yellow);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .admin-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .admin-item img {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .btn-danger {
      padding: 5px 10px;
      background: #ffebee;
      color: var(--danger);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-dark {
      width: 100%;
      height: 38px;
      background: var(--black);
      color: var(--yellow);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .status-msg {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
      display: none;
    }

    .status-msg.ok {
      display: block;
      background: #e8f5e9;
      color: var(--success);
    }

    .status-msg.err {
      display: block;
      background: #ffebee;
      color: var(--danger);
    }

    .footer {
      margin-top: auto;
      background: var(--black);
      color: #bdbdbd;
      padding: 16px 0;
      font-size: 12px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .admin-link {
      color: #9e9e9e;
      text-decoration: underline;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="container header-inner">
      <a href="#" class="logo" id="logoBtn"><span>YB</span> YellowBerry</a>

      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск товаров..." autocomplete="off">
        <button type="button" id="searchClear" class="search-clear" aria-label="Очистить">✕</button>
      </div>

      <button type="button" id="openCartBtn" class="cart-btn">
        Корзина <span id="cartBadge" class="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- Категории и фильтры -->
  <section class="controls">
    <div class="container">
      <div class="categories" id="categoryList"></div>

      <div class="filters">
        <input type="number" id="priceMin" class="price-input" placeholder="От, BYN" min="0" step="0.01">
        <span>—</span>
        <input type="number" id="priceMax" class="price-input" placeholder="До, BYN" min="0" step="0.01">
        <label class="checkbox-label">
          <input type="checkbox" id="discountOnly"> Только со скидкой
        </label>
        <button type="button" id="resetBtn" class="reset-btn">Сбросить</button>

        <select id="sortSelect" class="sort-select" aria-label="Сортировка">
          <option value="default">По умолчанию</option>
          <option value="price_asc">Сначала дешевые</option>
          <option value="price_desc">Сначала дорогие</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Каталог -->
  <main class="container">
    <div class="catalog-info">
      <span id="catTitle">Все товары</span>
      <span id="itemsCount">0 товаров</span>
    </div>
    <div class="grid" id="productGrid"></div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© 2026 YellowBerry — Простой маркетплейс (BYN)</span>
      <button type="button" id="openAdminBtn" class="admin-link">Админ-панель</button>
    </div>
  </footer>

  <!-- Модальное окно товара -->
  <div class="backdrop modal-center" id="productModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="panel-head">
        <span id="modalBrand">Товар</span>
        <button type="button" class="close-btn" id="closeProductBtn" aria-label="Закрыть">✕</button>
      </div>
      <div class="panel-body" id="productModalBody"></div>
    </div>
  </div>

  <!-- Боковая панель корзины -->
  <div class="backdrop drawer-side" id="cartDrawer" role="dialog" aria-modal="true">
    <div class="drawer-panel">
      <div class="panel-head">
        <span>Корзина</span>
        <button type="button" class="close-btn" id="closeCartBtn" aria-label="Закрыть">✕</button>
      </div>
      <div class="panel-body" id="cartBody"></div>
    </div>
  </div>

  <!-- Модальное окно входа в админку -->
  <div class="backdrop modal-center" id="adminLoginModal" role="dialog" aria-modal="true">
    <div class="modal-card" style="max-width: 360px;">
      <div class="panel-head">
        <span>Вход в админ-панель</span>
        <button type="button" class="close-btn" id="closeLoginBtn" aria-label="Закрыть">✕</button>
      </div>
      <div class="panel-body">
        <div id="loginError" class="status-msg err">Неверный пароль</div>
        <form id="adminLoginForm" class="order-form">
          <input type="password" id="adminPassInput" class="input-field" placeholder="Введите пароль" required>
          <button type="submit" class="btn-yellow" style="height: 40px;">Войти</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Модальное окно Админ-панели -->
  <div class="backdrop modal-center" id="adminModal" role="dialog" aria-modal="true">
    <div class="modal-card" style="max-width: 640px;">
      <div class="panel-head">
        <span>Админ-панель YellowBerry</span>
        <div style="display: flex; gap: 6px; align-items: center;">
          <button type="button" id="adminLogoutBtn" style="font-size: 12px; color: var(--gray); text-decoration: underline;">Выйти</button>
          <button type="button" class="close-btn" id="closeAdminBtn" aria-label="Закрыть">✕</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="admin-tabs">
          <button type="button" class="admin-tab active" data-tab="add">Добавить товар</button>
          <button type="button" class="admin-tab" data-tab="manage">Управление товарами</button>
          <button type="button" class="admin-tab" data-tab="export">Сохранить для GitHub</button>
        </div>
        <div id="adminStatus" class="status-msg"></div>
        <div id="adminContent"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const ADMIN_PASS = '1029384756';
      const AUTH_KEY = 'yb_admin_auth';
      const PRODUCTS_KEY = 'yb_products';
      const CART_KEY = 'yb_simple_cart_byn';

      // Генерация легкого встроенного SVG-изображения
      function makeSVG(bg, icon, tag) {
        const shapes = {

          watch: '<rect x="84" y="28" width="32" height="144" rx="6" fill="#444"/><rect x="66" y="60" width="68" height="80" rx="16" fill="#1A1A1A" stroke="#FFCC00" stroke-width="4"/>',
          hoodie: '<path d="M65 55 L100 42 L135 55 L160 85 L144 100 L132 88 L132 152 L68 152 L68 88 L56 100 L40 85 Z" fill="#1A1A1A"/><circle cx="100" cy="56" r="12" fill="#FFCC00"/>',
          sneakers: '<path d="M35 128 Q42 95 75 95 L105 78 L125 98 Q162 102 168 128 Z" fill="#1A1A1A"/><rect x="32" y="126" width="138" height="14" rx="6" fill="#FFCC00"/>',
          kettle: '<path d="M66 65 L134 65 L144 142 L56 142 Z" fill="#1A1A1A"/><path d="M134 80 Q158 80 158 108 Q158 132 138 132" fill="none" stroke="#1A1A1A" stroke-width="8"/><rect x="52" y="142" width="96" height="10" rx="4" fill="#FFCC00"/>',
          serum: '<rect x="78" y="72" width="44" height="80" rx="8" fill="#1A1A1A"/><rect x="88" y="54" width="24" height="18" fill="#FFCC00"/><rect x="95" y="38" width="10" height="16" rx="4" fill="#1A1A1A"/>',
          dumbbell: '<rect x="55" y="94" width="90" height="12" rx="4" fill="#444"/><rect x="38" y="72" width="18" height="56" rx="5" fill="#1A1A1A"/><rect x="144" y="72" width="18" height="56" rx="5" fill="#1A1A1A"/>',
          powerbank: '<rect x="66" y="44" width="68" height="112" rx="12" fill="#1A1A1A"/><rect x="78" y="58" width="44" height="10" rx="3" fill="#FFCC00"/>',
          tshirt: '<path d="M62 54 L138 54 L164 80 L146 96 L134 84 L134 150 L66 150 L66 84 L54 96 L36 80 Z" fill="#1A1A1A"/>',
          boots: '<path d="M62 54 L104 54 L104 105 Q152 108 158 134 L58 134 Z" fill="#1A1A1A"/><rect x="56" y="134" width="104" height="12" rx="4" fill="#FFCC00"/>',
          pan: '<circle cx="92" cy="100" r="44" fill="#1A1A1A"/><rect x="132" y="94" width="46" height="12" rx="6" fill="#FFCC00"/>',
          cream: '<rect x="58" y="86" width="84" height="56" rx="10" fill="#1A1A1A"/><rect x="54" y="70" width="92" height="16" rx="5" fill="#FFCC00"/>',
          mat: '<rect x="46" y="78" width="108" height="44" rx="22" fill="#1A1A1A"/><circle cx="132" cy="100" r="15" fill="#FFCC00"/>',
          jeans: '<path d="M66 46 L134 46 L142 154 L108 154 L100 96 L92 154 L58 154 Z" fill="#1A1A1A"/>'
        };
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="${bg}"/>${shapes[icon] || ''}<text x="100" y="184" text-anchor="middle" fill="#1A1A1A" opacity="0.5" font-family="sans-serif" font-weight="700" font-size="11">${tag}</text></svg>`;
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      }

      // Базовый массив товаров
      const DEFAULT_PRODUCTS = [
        {
          id: 1,
          brand: 'SoundCore',
          title: 'Беспроводные наушники TWS Pro',
          category: 'Электроника',
          price: 89.90,

          const saved = localStorage.getItem(PRODUCTS_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return Array.isArray(EMBEDDED_PRODUCTS) ? EMBEDDED_PRODUCTS : [...DEFAULT_PRODUCTS];
      }

        return Number(val).toFixed(2).replace('.', ',') + ' BYN';

        const count = Object.values(state.cart).reduce((sum, n) => sum + n, 0);
        document.getElementById('cartBadge').textContent = count;

        const next = (state.cart[id] || 0) + delta;
        if (next <= 0) {
          delete state.cart[id];
        } else {
          state.cart[id] = next;
        }
        saveCart();
        updateBadge();
        renderProducts();
        if (document.getElementById('cartDrawer').classList.contains('open')) {

      // Фильтрация и рендер сетки товаров
      function renderProducts() {
        const q = state.search.trim().toLowerCase();
        const min = state.priceMin !== '' ? Number(state.priceMin) : null;
        const max = state.priceMax !== '' ? Number(state.priceMax) : null;

        let items = products.filter(p => {
          if (state.category !== 'Все' && p.category !== state.category) return false;
          if (state.discountOnly && (!p.oldPrice || p.oldPrice <= p.price)) return false;
          if (min !== null && !isNaN(min) && p.price < min) return false;
          if (max !== null && !isNaN(max) && p.price > max) return false;
          if (q && !`${p.brand} ${p.title} ${p.category}`.toLowerCase().includes(q)) return false;
          return true;
        });

        if (state.sort === 'price_asc') items = [...items].sort((a, b) => a.price - b.price);
        if (state.sort === 'price_desc') items = [...items].sort((a, b) => b.price - a.price);

        document.getElementById('catTitle').textContent = state.category === 'Все' ? 'Все товары' : state.category;
        document.getElementById('itemsCount').textContent = `Найдено: ${items.length}`;

        const grid = document.getElementById('productGrid');
        if (items.length === 0) {
          grid.innerHTML = `
            <div class="empty">

            : `<button type="button" class="btn-yellow js-add" data-id="${p.id}">В корзину</button>`;

          return `
            <article class="card">
              <div class="card-img js-open" data-id="${p.id}">

              <div class="card-body">

        }).join('');

      // Сжатие фото через canvas до 400x400px JPEG (качество 0.75)
      function compressImageFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Ошибка чтения файла'));
          reader.onload = ev => {
            const img = new Image();
            img.onerror = () => reject(new Error('Некорректное изображение'));
            img.onload = () => {
              const maxSize = 400;
              let w = img.width;
              let h = img.height;
              if (w > maxSize || h > maxSize) {
                if (w > h) {
                  h = Math.round((h * maxSize) / w);
                  w = maxSize;
                } else {
                  w = Math.round((w * maxSize) / h);
                  h = maxSize;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.75));
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

          container.innerHTML = `
            <p style="font-size: 13px; color: var(--gray); margin-bottom: 12px;">
              На GitHub Pages изменения сохраняются в вашем браузере. Чтобы новые товары увидели все покупатели, скачайте обновленный файл <strong>index.html</strong> и замените его в репозитории GitHub:
            </p>
            <button type="button" id="admDownloadHtml" class="btn-yellow" style="height: 42px; font-size: 14px; margin-bottom: 10px;">
              ⬇ Скачать готовый index.html
            </button>
            <button type="button" id="admCopyJs" class="btn-dark" style="margin-bottom: 12px;">
              Скопировать массив товаров (JS)
            </button>
            <textarea id="admExportBox" class="textarea-field" readonly style="height: 140px; font-family: monospace; font-size: 11px;">${jsCode}</textarea>
          `;
        }
      }

      // События
      document.getElementById('logoBtn').addEventListener('click', e => {
        e.preventDefault();
        resetAll();
      });

      const searchInput = document.getElementById('searchInput');
      const searchClear = document.getElementById('searchClear');

      searchInput.addEventListener('input', e => {
        state.search = e.target.value;
        searchClear.classList.toggle('visible', state.search.length > 0);
        renderProducts();
      });

      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        state.search = '';
        searchClear.classList.remove('visible');
        renderProducts();
      });

      document.getElementById('categoryList').addEventListener('click', e => {
        const btn = e.target.closest('.cat-btn');
        if (!btn) return;
        state.category = btn.dataset.cat;
        renderCategories();
        renderProducts();
      });

      document.getElementById('priceMin').addEventListener('input', e => {
        state.priceMin = e.target.value;
        renderProducts();
      });

      document.getElementById('priceMax').addEventListener('input', e => {
        state.priceMax = e.target.value;
        renderProducts();
      });

      document.getElementById('discountOnly').addEventListener('change', e => {
        state.discountOnly = e.target.checked;
        renderProducts();
      });

      document.getElementById('sortSelect').addEventListener('change', e => {
        state.sort = e.target.value;
        renderProducts();
      });

      document.getElementById('resetBtn').addEventListener('click', resetAll);

      document.getElementById('productGrid').addEventListener('click', e => {
        if (e.target.id === 'emptyReset') return resetAll();
        const add = e.target.closest('.js-add');
        if (add) return changeQty(Number(add.dataset.id), 1);
        const inc = e.target.closest('.js-inc');
        if (inc) return changeQty(Number(inc.dataset.id), 1);
        const dec = e.target.closest('.js-dec');
        if (dec) return changeQty(Number(dec.dataset.id), -1);
        const open = e.target.closest('.js-open');
        if (open) openProduct(Number(open.dataset.id));
      });

      const productModal = document.getElementById('productModal');
      document.getElementById('closeProductBtn').addEventListener('click', () => productModal.classList.remove('open'));
      productModal.addEventListener('click', e => {
        if (e.target === productModal) productModal.classList.remove('open');
        const add = e.target.closest('.js-modal-add');
        if (add) {
          changeQty(Number(add.dataset.id), 1);
          productModal.classList.remove('open');
        }
      });

      const cartDrawer = document.getElementById('cartDrawer');
      document.getElementById('openCartBtn').addEventListener('click', () => {
        renderCart();
        cartDrawer.classList.add('open');
      });
      document.getElementById('closeCartBtn').addEventListener('click', () => cartDrawer.classList.remove('open'));
      cartDrawer.addEventListener('click', e => {
        if (e.target === cartDrawer || e.target.id === 'goCatalogBtn') {
          cartDrawer.classList.remove('open');
          return;
        }
        const inc = e.target.closest('.js-c-inc');
        if (inc) return changeQty(Number(inc.dataset.id), 1);
        const dec = e.target.closest('.js-c-dec');
        if (dec) return changeQty(Number(dec.dataset.id), -1);
        const del = e.target.closest('.js-c-del');
        if (del) {
          delete state.cart[Number(del.dataset.id)];
          saveCart();
          updateBadge();
          renderProducts();
          renderCart();
        }
      });

      cartDrawer.addEventListener('submit', e => {
        if (e.target.id === 'orderForm') {
          e.preventDefault();
          const name = document.getElementById('custName').value.trim();
          const num = Math.floor(10000 + Math.random() * 90000);
          state.cart = {};
          saveCart();
          updateBadge();
          renderProducts();
          document.getElementById('cartBody').innerHTML = `
            <div style="text-align: center; padding: 36px 12px;">
              <h3 style="margin-bottom: 8px;">Заказ №${num} принят!</h3>
              <p style="font-size: 13px; color: var(--gray); margin-bottom: 16px;">
                Спасибо, ${name}! Мы сообщим, когда заказ прибудет в пункт выдачи.
              </p>
              <button type="button" class="btn-yellow" id="goCatalogBtn" style="width: auto; padding: 0 18px;">Закрыть</button>
            </div>
          `;
        }
      });

      // События Админ-панели
      const adminLoginModal = document.getElementById('adminLoginModal');
      const adminModal = document.getElementById('adminModal');

      document.getElementById('openAdminBtn').addEventListener('click', openAdminEntry);
      document.getElementById('closeLoginBtn').addEventListener('click', () => adminLoginModal.classList.remove('open'));
      adminLoginModal.addEventListener('click', e => {
        if (e.target === adminLoginModal) adminLoginModal.classList.remove('open');
      });

      document.getElementById('adminLoginForm').addEventListener('submit', e => {
        e.preventDefault();
        const pass = document.getElementById('adminPassInput').value;
        if (pass === ADMIN_PASS) {
          sessionStorage.setItem(AUTH_KEY, '1');
          adminLoginModal.classList.remove('open');
          showAdminStatus('');
          renderAdminPanel();
          adminModal.classList.add('open');
        } else {
          document.getElementById('loginError').classList.add('err');
        }
      });

      document.getElementById('closeAdminBtn').addEventListener('click', () => adminModal.classList.remove('open'));
      adminModal.addEventListener('click', e => {
        if (e.target === adminModal) adminModal.classList.remove('open');

        const tabBtn = e.target.closest('.admin-tab');
        if (tabBtn) {
          state.adminTab = tabBtn.dataset.tab;
          showAdminStatus('');
          renderAdminPanel();
          return;
        }

        const delBtn = e.target.closest('.js-adm-del');
        if (delBtn) {
          const id = Number(delBtn.dataset.id);
          products = products.filter(p => p.id !== id);
          delete state.cart[id];
          saveProducts();
          saveCart();
          updateBadge();
          renderProducts();
          renderAdminPanel();
          showAdminStatus('Товар удален', 'ok');
          return;
        }

        if (e.target.id === 'admResetDefaults') {
          localStorage.removeItem(PRODUCTS_KEY);
          products = [...DEFAULT_PRODUCTS];
          renderProducts();
          renderAdminPanel();
          showAdminStatus('Восстановлены стандартные товары', 'ok');
          return;
        }

        if (e.target.id === 'admDownloadHtml') {
          const html = buildUpdatedHTML();
          const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showAdminStatus('Файл index.html скачан! Загрузите его в репозиторий GitHub.', 'ok');
          return;
        }

        if (e.target.id === 'admCopyJs') {
          const box = document.getElementById('admExportBox');
          box.select();
          document.execCommand('copy');
          showAdminStatus('Код массива товаров скопирован в буфер обмена', 'ok');
        }
      });

      document.getElementById('adminLogoutBtn').addEventListener('click', () => {
        sessionStorage.removeItem(AUTH_KEY);
        adminModal.classList.remove('open');
      });

      document.getElementById('adminContent').addEventListener('submit', async e => {
        if (e.target.id !== 'addProductForm') return;
        e.preventDefault();

        const title = document.getElementById('admTitle').value.trim();
        const brand = document.getElementById('admBrand').value.trim();
        const category = document.getElementById('admCat').value;
        const price = parseFloat(document.getElementById('admPrice').value);
        const oldPriceRaw = document.getElementById('admOldPrice').value;
        const oldPrice = oldPriceRaw ? parseFloat(oldPriceRaw) : null;
        const imgUrl = document.getElementById('admImgUrl').value.trim();
        const imgFile = document.getElementById('admImgFile').files[0];
        const description = document.getElementById('admDesc').value.trim();

        let image = makeSVG('#fff8cc', 'tshirt', brand.toUpperCase().slice(0, 10));
        if (imgFile) {
          try {
            image = await compressImageFile(imgFile);
          } catch (err) {
            showAdminStatus('Не удалось обработать фото. Попробуйте другой файл.', 'err');
            return;
          }
        } else if (imgUrl) {
          image = imgUrl;
        }

        const newId = products.length ? Math.max(...products.map(p => p.id)) + 1 : 1;
        products.unshift({
          id: newId,
          brand,
          title,
          category,
          price: Number(price.toFixed(2)),
          oldPrice: oldPrice && oldPrice > price ? Number(oldPrice.toFixed(2)) : null,
          image,
          description: description || 'Новый товар маркетплейса YellowBerry.',
          specs: { 'Категория': category, 'Бренд': brand }
        });

        saveProducts();
        renderProducts();
        e.target.reset();
        showAdminStatus(`Товар «${brand} — ${title}» добавлен в каталог!`, 'ok');
      });

      // Поддержка открытия по хешу #admin
      if (window.location.hash === '#admin') {
        openAdminEntry();
      }
      window.addEventListener('hashchange', () => {
        if (window.location.hash === '#admin') openAdminEntry();
      });

      // Инициализация
      renderCategories();
      renderProducts();
      updateBadge();
    })();
  </script>
</body>
</html>
